services:
  db:
    image: mysql:8.4
    container_name: fiberops-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fiberops}
      MYSQL_USER: ${MYSQL_USER:-fiberops}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - fiberops_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    build: .
    container_name: fiberops-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      RUN_MIGRATIONS: "true"
      DATABASE_URL: mysql://${MYSQL_USER:-fiberops}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:-fiberops}
      JWT_SECRET: ${JWT_SECRET}
      LOCAL_ADMIN_USERNAME: ${LOCAL_ADMIN_USERNAME:-admin}
      LOCAL_ADMIN_PASSWORD: ${LOCAL_ADMIN_PASSWORD}
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  fiberops_mysql_data:
